# Publishes to npm when a "vX.Y.Z" tag is pushed. Idle until you push a tag.
#
# Requires Trusted Publishing on npmjs.com for this repo + this workflow file
# (no NPM_TOKEN). Node 24 + current npm are required — older Node/npm report
# Trusted Publishing failures as a misleading E404 "not in this registry".
#
# Do not re-tag a version that is already on npm; bump package.json first.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 24 ships npm new enough for OIDC Trusted Publishing.
          # Avoid registry-url here: it writes an .npmrc that can make npm
          # prefer token auth over OIDC and fail with a fake E404.
          node-version: "24"

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
