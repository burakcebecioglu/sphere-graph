# Publishes to npm when a "vX.Y.Z" tag is pushed. Idle until you push a tag.
#
# Before the first tag push, this needs one of:
#   1. npm Trusted Publishing (recommended): on npmjs.com, once the package
#      name is registered, add this repo + this workflow file as a Trusted
#      Publisher for "sphere-graph". No secret needed — `npm publish` uses
#      the OIDC token from `id-token: write` below.
#   2. A classic token: create an npm Automation token, store it as the
#      `NPM_TOKEN` repository secret, and add
#        env:
#          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
#      to the "Publish" step below (and drop --provenance if so).
#
# Either way, the very first publish of a brand-new package name typically
# has to happen once from a maintainer's machine (`npm publish --access
# public`) before Trusted Publishing can be configured for it on npmjs.com.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
